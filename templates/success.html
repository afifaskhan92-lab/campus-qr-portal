{% extends "base.html" %}

{% block title %}Ticket Confirmation{% endblock %}

{% block content %}
    <div class="card" style="text-align:center;">
        <span class="badge">🎉 Registration Confirmed</span>
        <h3>{{ event }}</h3>
        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Ticket ID:</strong> {{ ticket_id }}</p>
        <div>
            <img class="qr-code" src="{{ url_for('static', filename=qr_file) }}" alt="Ticket QR Code">
        </div>
        <p class="muted">Gate pe ye QR code scan karein.</p>
        <br>
        <a class="link" href="/">← Register Another Student</a>
    </div>
{% endblock %}
