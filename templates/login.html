{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>🔐 Login</h2>

    {% if error %}<div class="errors">{{ error }}</div>{% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="text" name="username" placeholder="Username" required autofocus
               autocomplete="username">
        <input type="password" name="password" placeholder="Password" required
               autocomplete="current-password">
        <button type="submit">Login</button>
    </form>

    <p class="muted" style="text-align:center;">
        Agar aapka account nahi hai, to admin se contact karein.
        Ya phir <a class="link" href="/register-user">yahan</a> login karke new user create karein.
    </p>
    <p style="text-align:center;"><a class="link" href="/">← Home</a></p>
</div>
{% endblock %}
